name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Nothing of a company or a person in the tree (names, hosts, private addresses, emails, secrets): scripts/public-audit.mjs,
      # a copy of the one in the Coxia repository.
      - name: Public audit
        run: node scripts/public-audit.mjs

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The supervisor against a fake core on 127.0.0.1; no real core, model or network.
      - name: Test
        run: npm test

      # The install script cannot run on a CI machine; this catches the mistakes a reader would.
      - name: Lint the install script
        run: shellcheck deploy/install.sh
